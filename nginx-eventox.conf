# Configuração Nginx para evento.kazix.site (e eventox.kazix.site)
# Destino: /etc/nginx/sites-available/eventox
# Ativar: sudo ln -sf /etc/nginx/sites-available/eventox /etc/nginx/sites-enabled/
# Testar: sudo nginx -t
# Recarregar: sudo systemctl reload nginx
# Ativar SSL: sudo certbot --nginx -d evento.kazix.site -d eventox.kazix.site

server {
    listen 80;
    server_name evento.kazix.site eventox.kazix.site;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
